name: Tighten Sealed Hoops Regressions

on:
  push:
    paths:
      - '.github/workflows/tighten-sealed-hoops-regressions.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply sealed Hoops regression tightening
        run: python3 scripts/tighten-sealed-hoops-regressions.py

      - name: Validate sealed changes
        shell: bash
        run: |
          node --check src/index.js
          node --check sealed-product-scout.js
          node tests/sealed-product-vision.test.cjs
          grep -q 'const VERSION = "3.40.1"' src/index.js
          grep -q 'sealed:intel:v3:' src/index.js
          grep -q 'sealedRipEvidenceYearConflict' src/index.js
          grep -q 'sealedRipEvidenceBrandConflict' src/index.js
          git diff --check

      - name: Commit feature
        shell: bash
        run: |
          if git diff --quiet; then
            echo 'No changes needed.'
            exit 0
          fi
          git config user.name 'HOF Card Scout Automation'
          git config user.email 'actions@users.noreply.github.com'
          git add src/index.js tests/sealed-product-vision.test.cjs
          git commit -m 'Tighten sealed product identity and evidence filtering'
          git push
