name: Canonicalize Chase Depth

on:
  push:
    paths:
      - 'scripts/canonicalize-chase-depth.py'
      - '.github/workflows/canonicalize-chase-depth.yml'

permissions:
  contents: write

jobs:
  patch-test-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply Chase Depth canonicalization
        run: |
          python3 scripts/canonicalize-chase-depth.py
          python3 - <<'PY'
          from pathlib import Path
          p=Path('tests/sealed-product-vision.test.cjs')
          s=p.read_text(encoding='utf-8')
          replacements={
              'assert.match(worker,/const VERSION = "3\\.44\\.0"/);':'assert.match(worker,/const VERSION = "3\\.45\\.0"/);',
              "assert.match(worker,/sealed:intel:v15:/,'sealed product intelligence must use a reusable mode-scoped product cache');":"assert.match(worker,/sealed:intel:v16:/,'sealed product intelligence must use a reusable mode-scoped product cache');",
          }
          for old,new in replacements.items():
              if old not in s:
                  raise SystemExit(f'stale assertion not found: {old}')
              s=s.replace(old,new,1)
          p.write_text(s,encoding='utf-8')
          PY

      - name: Validate canonical Chase Depth
        run: |
          set -euo pipefail
          node --check src/index.js
          node --check sealed-product-scout.js
          node tests/sealed-product-vision.test.cjs
          node tests/chase-depth-canonical.test.cjs
          grep -q 'const VERSION = "3.45.0"' src/index.js
          grep -q 'sealed:intel:v16:' src/index.js
          grep -q 'function sealedRipChaseCanonicalIdentity' src/index.js
          grep -q 'function sealedRipChaseIdentityGroups' src/index.js
          grep -q 'chaseDepthParallelBreadth' src/index.js
          git diff --check

      - name: Commit Chase Depth canonicalization
        run: |
          set -euo pipefail
          git config user.name 'HOF Card Scout Automation'
          git config user.email 'actions@users.noreply.github.com'
          git add src/index.js tests/sealed-product-vision.test.cjs tests/chase-depth-canonical.test.cjs
          git commit -m 'Canonicalize Chase Depth identities'
          git push

      - name: Deploy Worker
        env:
          CF_API_TOKEN_RAW: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CF_ACCOUNT_ID_RAW: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          if [[ "$CF_API_TOKEN_RAW" =~ (cfut_[A-Za-z0-9_-]+) ]]; then
            export CLOUDFLARE_API_TOKEN="${BASH_REMATCH[1]}"
          else
            TOKEN_CLEAN="$(printf '%s' "$CF_API_TOKEN_RAW" | tr -d '\r\n\t ')"
            TOKEN_CLEAN="${TOKEN_CLEAN#Bearer}"
            TOKEN_CLEAN="${TOKEN_CLEAN#bearer}"
            TOKEN_CLEAN="${TOKEN_CLEAN//\"/}"
            TOKEN_CLEAN="${TOKEN_CLEAN//\'/}"
            export CLOUDFLARE_API_TOKEN="$TOKEN_CLEAN"
          fi
          export CLOUDFLARE_ACCOUNT_ID="$(printf '%s' "$CF_ACCOUNT_ID_RAW" | tr -d '\r\n\t ')"
          test -n "$CLOUDFLARE_API_TOKEN"
          test -n "$CLOUDFLARE_ACCOUNT_ID"
          npx --yes wrangler@4 deploy
