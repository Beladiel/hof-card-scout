name: Apply Sealed Market Value Check

on:
  push:
    paths:
      - '.github/workflows/apply-sealed-market-check.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply sealed market value check
        run: python3 scripts/apply-sealed-market-check.py

      - name: Validate sealed market changes
        shell: bash
        run: |
          node --check src/index.js
          node --check sealed-product-scout.js
          node tests/sealed-product-vision.test.cjs
          grep -q 'sealed-product-scout.js?v=6.1.4' index.html
          grep -q '/sealed/value-check' src/index.js
          grep -q 'CHECK MARKET VALUE · 1 SEARCH MAX' sealed-product-scout.js
          git diff --check

      - name: Commit sealed market value check
        shell: bash
        run: |
          if git diff --quiet; then
            echo 'No changes needed.'
            exit 0
          fi
          git config user.name 'HOF Card Scout Automation'
          git config user.email 'actions@users.noreply.github.com'
          git add index.html sealed-product-scout.js src/index.js tests/sealed-product-vision.test.cjs
          git commit -m 'Add sealed product market value check'
          git push
