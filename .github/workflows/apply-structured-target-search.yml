name: Apply structured target search

on:
  push:
    branches: [main]
    paths:
      - apply_structured_target_search.py
      - .github/workflows/apply-structured-target-search.yml

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply migration
        run: python apply_structured_target_search.py
      - name: Run structured target tests
        run: node tests/structured-targets.test.cjs
      - name: Run Collection Intelligence tests
        run: node collection-intelligence.test.cjs
      - name: Run target ranking tests
        run: node tests/target-ranking.test.cjs
      - name: Commit changes
        run: |
          if git diff --quiet; then exit 0; fi
          git config user.name "HOF Card Scout Automation"
          git config user.email "actions@users.noreply.github.com"
          git add index.html tests/structured-targets.test.cjs
          git commit -m "Finish structured target management"
          git push origin main
