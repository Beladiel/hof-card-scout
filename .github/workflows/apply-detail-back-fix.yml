name: Apply detail back fix

on:
  push:
    branches: [main]
    paths:
      - apply_detail_back_fix.py
      - tests/detail-back-navigation.test.cjs
      - .github/workflows/apply-detail-back-fix.yml

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply navigation fix
        run: python apply_detail_back_fix.py
      - name: Run regression suite
        run: |
          node collection-intelligence.test.cjs
          for f in tests/*.test.cjs; do
            echo "Running $f"
            node "$f"
          done
      - name: Commit changes
        run: |
          git config user.name "HOF Card Scout Automation"
          git config user.email "actions@users.noreply.github.com"
          git add index.html tests/detail-back-navigation.test.cjs
          if git diff --cached --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git commit -m "Fix detail back navigation"
          git push
