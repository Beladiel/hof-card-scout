name: Apply Sealed Product Vision

on:
  push:
    branches: [main]
    paths:
      - apply-sealed-vision.py
      - .github/workflows/apply-sealed-vision.yml

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply sealed vision migration
        run: python apply-sealed-vision.py
      - name: Refresh Worker version expectations
        run: |
          python - <<'PY'
          from pathlib import Path
          for test in Path('tests').glob('*.test.cjs'):
              text=test.read_text(encoding='utf-8')
              text=text.replace("'3.34.0'", "'3.35.0'")
              text=text.replace('"3.34.0"', '"3.35.0"')
              text=text.replace('3\\.34\\.0', '3\\.35\\.0')
              test.write_text(text,encoding='utf-8')
          PY
      - name: Check JavaScript syntax
        run: |
          node --check sealed-product-scout.js
          node --check src/index.js
      - name: Run regression suite
        run: |
          node collection-intelligence.test.cjs
          for f in tests/*.test.cjs; do
            echo "Running $f"
            node "$f"
          done
      - name: Commit changes
        run: |
          git config user.name "HOF Card Scout Automation"
          git config user.email "actions@users.noreply.github.com"
          git add src/index.js wrangler.jsonc sealed-product-scout.js index.html tests/*.test.cjs
          if git diff --cached --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git commit -m "Add sealed product photo identification"
          git push
