name: Apply offline shopping report

on:
  push:
    branches: [main]
    paths:
      - apply_offline_shopping_report.py
      - shopping-report.js
      - .github/workflows/apply-offline-shopping-report.yml

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply offline shopping report
        run: python apply_offline_shopping_report.py
      - name: Run full regression suite
        run: |
          for f in tests/*.test.cjs; do
            echo "Running $f"
            node "$f"
          done
      - name: Commit changes
        run: |
          git config user.name "HOF Card Scout Automation"
          git config user.email "actions@users.noreply.github.com"
          git add index.html tests
          if git diff --cached --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git commit -m "Add offline Excel shopping report"
          git push
