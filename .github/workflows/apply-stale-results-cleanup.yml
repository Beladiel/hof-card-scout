name: Apply stale marketplace result cleanup

on:
  push:
    branches: [main]
    paths:
      - apply_stale_results_cleanup.py
      - .github/workflows/apply-stale-results-cleanup.yml

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Repair migration splice
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('apply_stale_results_cleanup.py')
          s=p.read_text(encoding='utf-8')
          bad="s=s[:pos]+stale_branch+s[pos+len('  }else'):]"
          good="s=s[:pos]+stale_branch+branch+s[pos+len(branch):]"
          if bad not in s:
              raise SystemExit('migration splice anchor not found')
          p.write_text(s.replace(bad,good,1),encoding='utf-8')
          PY
      - name: Apply migration
        run: python apply_stale_results_cleanup.py
      - name: Run full regression suite
        run: |
          for f in tests/*.test.cjs; do
            echo "Running $f"
            node "$f"
          done
      - name: Commit changes
        run: |
          git config user.name "HOF Card Scout Automation"
          git config user.email "actions@users.noreply.github.com"
          git add index.html tests/collection-dashboard.test.cjs tests/stale-results.test.cjs
          if git diff --cached --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git commit -m "Expire stale marketplace results"
          git push
