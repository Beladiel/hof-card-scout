          grep -q 'id="teamHofGrid"' index.html
          grep -q 'Bobby Witt Jr.' index.html
          grep -q 'Ezequiel Tovar' index.html
          python <<'PY'
          from pathlib import Path
          import re, subprocess, tempfile
          text=Path('index.html').read_text(encoding='utf-8')
          scripts=re.findall(r'<script(?:\s[^>]*)?>(.*?)</script>',text,re.S|re.I)
          checked=0
          for script in scripts:
              if not script.strip():
                  continue
              with tempfile.NamedTemporaryFile('w',suffix='.js',encoding='utf-8',delete=False) as f:
                  f.write(script)
                  name=f.name
              result=subprocess.run(['node','--check',name],capture_output=True,text=True)
              if result.returncode:
                  print(result.stdout)
                  print(result.stderr)
                  raise SystemExit('Inline JavaScript syntax check failed')
              checked+=1
          print(f'Validated {checked} inline script block(s).')
          PY

      - name: Commit forecast update
