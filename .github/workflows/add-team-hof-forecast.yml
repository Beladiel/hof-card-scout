name: Add team HOF bargain-bin forecast

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/add-team-hof-forecast.yml

permissions:
  contents: write

jobs:
  patch-forecast:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Validate patch script
        run: python -m py_compile .github/scripts/add_team_hof_forecast.py

      - name: Add 30-team bargain-bin forecast
        run: python .github/scripts/add_team_hof_forecast.py

      - name: Validate patched app
        run: |
          grep -q 'id="teamHofGrid"' index.html
          grep -q 'Bobby Witt Jr.' index.html
          grep -q 'Ezequiel Tovar' index.html
          grep -q 'renderTeamHofTargets' index.html

      - name: Commit forecast update
        run: |
          if git diff --quiet -- index.html; then
            echo 'No index.html changes to commit.'
            exit 0
          fi
          git config user.name 'Scout App Updater'
          git config user.email 'actions@users.noreply.github.com'
          git add index.html
          git commit -m 'Add 30-team HOF bargain-bin forecast'
          git push
