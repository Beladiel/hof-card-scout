name: Add team HOF bargain-bin forecast

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/add-team-hof-forecast.yml

permissions:
  contents: write

jobs:
  patch-forecast:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Add 30-team bargain-bin forecast
        shell: bash
        run: |
          python <<'PY'
          from pathlib import Path

