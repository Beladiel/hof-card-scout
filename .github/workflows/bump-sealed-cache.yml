name: Force Fresh Sealed Scanner

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/bump-sealed-cache.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Bump sealed scanner cache key
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')
          old = 'sealed-product-scout.js?v=6.1.0'
          new = 'sealed-product-scout.js?v=6.1.1'
          if old not in s:
              raise SystemExit('Expected sealed scanner cache key not found')
          s = s.replace(old, new, 1)
          p.write_text(s, encoding='utf-8')
          PY
          grep -F 'sealed-product-scout.js?v=6.1.1' index.html
          node --check sealed-product-scout.js

      - name: Commit cache bust and remove temporary workflow
        shell: bash
        run: |
          git config user.name "HOF Card Scout Automation"
          git config user.email "actions@users.noreply.github.com"
          git rm .github/workflows/bump-sealed-cache.yml
          git add index.html
          git commit -m "Force fresh sealed barcode scanner UI"
          git push origin main
