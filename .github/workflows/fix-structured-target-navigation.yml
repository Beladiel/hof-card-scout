name: Fix structured target navigation

on:
  push:
    branches: [main]
    paths:
      - fix_structured_target_navigation.py
      - .github/workflows/fix-structured-target-navigation.yml

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - run: python fix_structured_target_navigation.py
      - run: node collection-intelligence.test.cjs
      - run: node tests/target-ranking.test.cjs
      - run: node tests/top5-targets.test.cjs
      - run: node tests/structured-targets.test.cjs
      - name: Commit fix
        run: |
          git config user.name "HOF Card Scout Automation"
          git config user.email "actions@users.noreply.github.com"
          git add index.html tests/structured-targets.test.cjs
          git commit -m "Fix structured target navigation"
          git push origin main
