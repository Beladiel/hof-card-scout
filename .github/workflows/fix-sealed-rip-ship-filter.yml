name: Fix Sealed Rip Ship Filter

on:
  push:
    paths:
      - '.github/workflows/fix-sealed-rip-ship-filter.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply filter fix
        run: python3 scripts/fix-sealed-rip-ship-filter.py
      - name: Validate filter fix
        shell: bash
        run: |
          node --check src/index.js
          node tests/sealed-product-vision.test.cjs
          grep -q 'const VERSION = "3.38.1"' src/index.js
          grep -Fq 'rip\s*(?:&|and)\s*ship' src/index.js
          git diff --check
      - name: Commit filter fix
        shell: bash
        run: |
          if git diff --quiet; then
            echo 'No changes needed.'
            exit 0
          fi
          git config user.name 'HOF Card Scout Automation'
          git config user.email 'actions@users.noreply.github.com'
          git add src/index.js tests/sealed-product-vision.test.cjs
          git commit -m 'Reject rip-and-ship sealed listings'
          git push
