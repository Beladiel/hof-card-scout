name: Apply Top 5 target ranking

on:
  push:
    branches: [main]
    paths:
      - apply_top5_targets.py
      - .github/workflows/apply-top5-targets.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply Top 5 migration
        run: python apply_top5_targets.py

      - name: Validate Worker syntax
        run: node --check src/index.js

      - name: Run Collection Intelligence tests
        run: node collection-intelligence.test.cjs

      - name: Run target ranking tests
        run: node tests/target-ranking.test.cjs

      - name: Run Top 5 contract test
        run: node tests/top5-targets.test.cjs

      - name: Commit migrated files
        run: |
          if git diff --quiet; then
            echo "No migration changes to commit."
            exit 0
          fi
          git config user.name "HOF Card Scout Automation"
          git config user.email "actions@users.noreply.github.com"
          git add src/index.js index.html phase6-find-target.html phase6-monthly-pick.html tests/target-ranking.test.cjs tests/top5-targets.test.cjs
          git commit -m "Return ranked Top 5 target choices"
          git push origin main
