name: Fix Sealed Market Price Autosave

on:
  push:
    paths:
      - '.github/workflows/fix-sealed-market-price-autosave.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply shelf price autosave fix
        run: python3 scripts/fix-sealed-market-price-autosave.py

      - name: Validate fix
        shell: bash
        run: |
          node --check sealed-product-scout.js
          node tests/sealed-product-vision.test.cjs
          grep -q 'sealed-product-scout.js?v=6.1.5' index.html
          grep -q 'market check must auto-save the entered shelf price' tests/sealed-product-vision.test.cjs
          git diff --check

      - name: Commit fix
        shell: bash
        run: |
          if git diff --quiet; then
            echo 'No changes needed.'
            exit 0
          fi
          git config user.name 'HOF Card Scout Automation'
          git config user.email 'actions@users.noreply.github.com'
          git add index.html sealed-product-scout.js tests/sealed-product-vision.test.cjs
          git commit -m 'Fix sealed market shelf price handoff'
          git push
