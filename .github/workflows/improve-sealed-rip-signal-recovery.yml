name: Improve Sealed Rip Signal Recovery

on:
  push:
    paths:
      - '.github/workflows/improve-sealed-rip-signal-recovery.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply signal recovery refinement
        run: python3 scripts/improve-sealed-rip-signal-recovery.py

      - name: Validate refinement
        shell: bash
        run: |
          node --check src/index.js
          node --check sealed-product-scout.js
          node tests/sealed-product-vision.test.cjs
          grep -q 'const VERSION = "3.38.8"' src/index.js
          grep -q 'sealed:rip:v5:' src/index.js
          grep -q 'sealedRipTrustedResearchSites' src/index.js
          grep -q 'sealedRipPromptSignals' src/index.js
          grep -q 'recoveryPrompt' src/index.js
          git diff --check

      - name: Commit refinement
        shell: bash
        run: |
          if git diff --quiet; then
            echo 'No changes needed.'
            exit 0
          fi
          git config user.name 'HOF Card Scout Automation'
          git config user.email 'actions@users.noreply.github.com'
          git add src/index.js tests/sealed-product-vision.test.cjs
          git commit -m 'Improve sealed chase and odds extraction'
          git push
