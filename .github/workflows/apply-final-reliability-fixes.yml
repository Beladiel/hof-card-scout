name: Apply final reliability fixes

on:
  push:
    branches: [main]
    paths:
      - apply_final_reliability_fixes.py
      - .github/workflows/apply-final-reliability-fixes.yml

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply reliability fixes
        run: python apply_final_reliability_fixes.py
      - name: Run full regression suite
        run: |
          for f in tests/*.test.cjs; do
            echo "Running $f"
            node "$f"
          done
      - name: Commit changes
        run: |
          git config user.name "HOF Card Scout Automation"
          git config user.email "actions@users.noreply.github.com"
          git add index.html tests/collection-dashboard.test.cjs tests/end-to-end-reliability.test.cjs
          if git diff --cached --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git commit -m "Close final collection reliability gaps"
          git push
