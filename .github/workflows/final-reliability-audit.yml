name: Final reliability audit

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/final-reliability-audit.yml

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Compile inline app script
        run: |
          node - <<'NODE'
          const fs=require('node:fs');
          const vm=require('node:vm');
          const html=fs.readFileSync('index.html','utf8');
          const m=html.match(/<script>([\s\S]*)<\/script>/);
          if(!m) throw new Error('inline app script missing');
          new vm.Script(m[1]);
          console.log('Inline app script compiles');
          NODE
      - name: Run full regression suite
        run: |
          for f in tests/*.test.cjs; do
            echo "Running $f"
            node "$f"
          done
      - name: Inspect end-to-end state transitions
        run: |
          echo '--- purchase handlers ---'
          grep -n -A45 -B10 'phase3aSavePurchaseBtn' index.html || true
          echo '--- received handlers ---'
          grep -n -A45 -B10 'markReceived' index.html || true
          echo '--- backup/export/import ---'
          grep -n -A55 -B10 -E 'exportUpdates|importUpdates|EXPORT UPDATES|IMPORT UPDATES' index.html || true
          echo '--- collection persistence ---'
          grep -n -A45 -B10 -E 'savePlayerEdit|STORAGE_KEY|futureHofWrite' index.html | head -n 320 || true
          echo '--- target clearing / purchase handoff ---'
          grep -n -A30 -B10 -E 'clearStructuredTarget|ADD TO COLLECTION|incoming' index.html | tail -n 320 || true
