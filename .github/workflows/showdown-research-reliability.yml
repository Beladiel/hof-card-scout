name: Showdown Research Reliability

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/showdown-research-reliability.yml'

permissions:
  contents: write

jobs:
  patch-test-deploy:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply Showdown reliability patch
        run: python3 scripts/showdown-research-reliability.py

      - name: Normalize reliability regressions
        run: |
          python3 - <<'PY'
          from pathlib import Path

          test_path=Path('tests/sealed-product-vision.test.cjs')
          s=test_path.read_text(encoding='utf-8')
          old="assert.ok(worker.includes('sealed rip primary synthesis failed; trying compact authority-only retry'),'rip analysis must retry once with a compact authority-only prompt without another search');"
          new="assert.ok(worker.includes('sealed rip primary synthesis/parse failed; trying compact authority-only retry'),'rip analysis must retry once on synthesis or parse failure without another search');"
          if old not in s:
              raise SystemExit('stale retry assertion not found')
          test_path.write_text(s.replace(old,new,1),encoding='utf-8')

          worker_path=Path('src/index.js')
          w=worker_path.read_text(encoding='utf-8')
          old_terms='authority: "checklist rookies autographs parallels case hits odds",'
          new_terms='authority: "checklist",'
          if old_terms not in w:
              raise SystemExit('sports authority vocabulary anchor not found')
          w=w.replace(old_terms,new_terms,1)
          old_query='return `${authorityYear} ${researchSet} ${authorityCategory} ${authoritySite} checklist`.replace(/\\s+/g, " ").trim();'
          new_query='return `${authorityYear} ${researchSet} ${authorityCategory} ${authoritySite} ${researchTerms.authority}`.replace(/\\s+/g, " ").trim();'
          if old_query not in w:
              raise SystemExit('sports authority query anchor not found after migration')
          worker_path.write_text(w.replace(old_query,new_query,1),encoding='utf-8')

          rel_path=Path('tests/showdown-research-reliability.test.cjs')
          r=rel_path.read_text(encoding='utf-8')
          old_rel="assert.ok(worker.includes('return `${authorityYear} ${researchSet} ${authorityCategory} ${authoritySite} checklist`'), 'sports authority discovery must be set-first and omit exact format terms');"
          new_rel="assert.ok(worker.includes('authority: \"checklist\"') && worker.includes('return `${authorityYear} ${researchSet} ${authorityCategory} ${authoritySite} ${researchTerms.authority}`'), 'sports authority discovery must be set-first, category-routed, and omit exact format terms');"
          if old_rel not in r:
              raise SystemExit('reliability authority assertion anchor not found')
          rel_path.write_text(r.replace(old_rel,new_rel,1),encoding='utf-8')
          PY

      - name: Validate Showdown reliability
        run: |
          set -euo pipefail
          node --check src/index.js
          node --check sealed-product-scout.js
          node tests/sealed-product-vision.test.cjs
          node tests/chase-depth-canonical.test.cjs
          node tests/format-access-section-local.test.cjs
          node tests/showdown-research-reliability.test.cjs
          grep -q 'const VERSION = "3.47.0"' src/index.js
          grep -q 'sealed:intel:v18:' src/index.js
          grep -q 'sealed-product-scout.js?v=6.5.3' index.html
          git diff --check

      - name: Commit Showdown reliability
        run: |
          set -euo pipefail
          git config user.name 'HOF Card Scout Automation'
          git config user.email 'actions@users.noreply.github.com'
          git add src/index.js sealed-product-scout.js index.html tests/sealed-product-vision.test.cjs tests/showdown-research-reliability.test.cjs
          git commit -m 'Harden Shelf Showdown research failures'
          git push

      - name: Deploy Worker
        env:
          CF_API_TOKEN_RAW: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CF_ACCOUNT_ID_RAW: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          if [[ "$CF_API_TOKEN_RAW" =~ (cfut_[A-Za-z0-9_-]+) ]]; then
            export CLOUDFLARE_API_TOKEN="${BASH_REMATCH[1]}"
          else
            TOKEN_CLEAN="$(printf '%s' "$CF_API_TOKEN_RAW" | tr -d '\r\n\t ')"
            TOKEN_CLEAN="${TOKEN_CLEAN#Bearer}"
            TOKEN_CLEAN="${TOKEN_CLEAN#bearer}"
            TOKEN_CLEAN="${TOKEN_CLEAN//\"/}"
            TOKEN_CLEAN="${TOKEN_CLEAN//\'/}"
            export CLOUDFLARE_API_TOKEN="$TOKEN_CLEAN"
          fi
          export CLOUDFLARE_ACCOUNT_ID="$(printf '%s' "$CF_ACCOUNT_ID_RAW" | tr -d '\r\n\t ')"
          test -n "$CLOUDFLARE_API_TOKEN"
          test -n "$CLOUDFLARE_ACCOUNT_ID"
          npx --yes wrangler@4 deploy
