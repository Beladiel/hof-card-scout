name: Fix Sealed Evidence Integrity

on:
  push:
    paths:
      - 'scripts/fix-sealed-cross-set-odds-sentiment.py'
      - '.github/workflows/fix-sealed-cross-set-odds-sentiment.yml'

permissions:
  contents: write

jobs:
  patch-test-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply evidence integrity fix
        run: python3 scripts/fix-sealed-cross-set-odds-sentiment.py

      - name: Validate sealed changes
        shell: bash
        run: |
          set -euo pipefail
          node --check src/index.js
          node --check sealed-product-scout.js
          node tests/sealed-product-vision.test.cjs
          grep -q 'const VERSION = "3.40.3"' src/index.js
          grep -q 'sealed:intel:v5:' src/index.js
          grep -q 'sealedRipOddsRowSupported' src/index.js
          grep -q 'sealedRipEvidenceRowMatchesIdentity' src/index.js
          grep -q 'COMMUNITY EVIDENCE — use ONLY this section' src/index.js
          git diff --check

      - name: Commit feature
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet; then
            echo 'No changes needed.'
          else
            git config user.name 'HOF Card Scout Automation'
            git config user.email 'actions@users.noreply.github.com'
            git add src/index.js tests/sealed-product-vision.test.cjs
            git commit -m 'Keep sealed odds and sentiment tied to exact evidence'
            git push
          fi

      - name: Deploy Worker
        env:
          CF_API_TOKEN_RAW: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CF_ACCOUNT_ID_RAW: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ "$CF_API_TOKEN_RAW" =~ (cfut_[A-Za-z0-9_-]+) ]]; then
            export CLOUDFLARE_API_TOKEN="${BASH_REMATCH[1]}"
          else
            TOKEN_CLEAN="$(printf '%s' "$CF_API_TOKEN_RAW" | tr -d '\r\n\t ')"
            TOKEN_CLEAN="${TOKEN_CLEAN#Bearer}"
            TOKEN_CLEAN="${TOKEN_CLEAN#bearer}"
            TOKEN_CLEAN="${TOKEN_CLEAN//\"/}"
            TOKEN_CLEAN="${TOKEN_CLEAN//\'/}"
            export CLOUDFLARE_API_TOKEN="$TOKEN_CLEAN"
          fi
          export CLOUDFLARE_ACCOUNT_ID="$(printf '%s' "$CF_ACCOUNT_ID_RAW" | tr -d '\r\n\t ')"
          test -n "$CLOUDFLARE_API_TOKEN"
          test -n "$CLOUDFLARE_ACCOUNT_ID"
          npx --yes wrangler@4 deploy
