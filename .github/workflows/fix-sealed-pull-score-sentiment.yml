name: Fix Sealed Pull Score Sentiment

on:
  push:
    paths:
      - 'scripts/fix-sealed-pull-score-sentiment.py'
      - '.github/workflows/fix-sealed-pull-score-sentiment.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply sealed scoring fix
        run: python3 scripts/fix-sealed-pull-score-sentiment.py

      - name: Validate sealed changes
        shell: bash
        run: |
          set -euo pipefail
          node --check src/index.js
          node --check sealed-product-scout.js
          node tests/sealed-product-vision.test.cjs
          grep -q 'const VERSION = "3.40.2"' src/index.js
          grep -q 'sealed:intel:v4:' src/index.js
          grep -q 'sealedRipVerifiedPullScore' src/index.js
          grep -q 'communitySourceCount >= 2' src/index.js
          git diff --check

      - name: Commit feature
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet; then
            echo 'No changes needed.'
            exit 0
          fi
          git config user.name 'HOF Card Scout Automation'
          git config user.email 'actions@users.noreply.github.com'
          git add src/index.js tests/sealed-product-vision.test.cjs
          git commit -m 'Make sealed pull scoring and sentiment evidence consistent'
          git push
