name: Add Robust Barcode Decoder

on:
  push:
    paths:
      - '.github/workflows/add-zxing-barcode.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Add ZXing barcode decoding fallback
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          index = Path('index.html')
          html = index.read_text(encoding='utf-8')
          old_script = '<script src="sealed-product-scout.js?v=6.1.1"></script>'
          new_scripts = '<script src="https://unpkg.com/@zxing/browser@0.2.1/umd/zxing-browser.min.js"></script>\n<script src="sealed-product-scout.js?v=6.1.2"></script>'
          if 'zxing-browser.min.js' not in html:
              if old_script not in html:
                  raise SystemExit('Could not find sealed scanner script tag to patch')
              html = html.replace(old_script, new_scripts, 1)
          else:
              html = html.replace('sealed-product-scout.js?v=6.1.1', 'sealed-product-scout.js?v=6.1.2', 1)
          index.write_text(html, encoding='utf-8')

          scout = Path('sealed-product-scout.js')
          js = scout.read_text(encoding='utf-8')
          marker = '  function applyBarcodeResult(data){\n'
          zxing_fn = '''  async function zxingBarcodeFromFile(file){
            const api=window.ZXingBrowser;
            const Reader=api?.BrowserMultiFormatOneDReader||api?.BrowserMultiFormatReader;
            if(!file||!Reader)return "";
            try{
              const source=await fileToDataUrl(file);
              const img=await loadPhoto(source);
              const sw=img.naturalWidth||img.width,sh=img.naturalHeight||img.height;
              if(!sw||!sh)return "";
              const maxDim=2200,scale=Math.min(1,maxDim/Math.max(sw,sh));
              const base=document.createElement("canvas");
              base.width=Math.max(1,Math.round(sw*scale));base.height=Math.max(1,Math.round(sh*scale));
              base.getContext("2d",{alpha:false}).drawImage(img,0,0,base.width,base.height);
              const rotate=(canvas,quarterTurns)=>{
                const turns=((quarterTurns%4)+4)%4;
                if(!turns)return canvas;
                const out=document.createElement("canvas");
                const swap=turns%2===1;
                out.width=swap?canvas.height:canvas.width;out.height=swap?canvas.width:canvas.height;
                const ctx=out.getContext("2d",{alpha:false});
                ctx.translate(out.width/2,out.height/2);ctx.rotate(turns*Math.PI/2);
                ctx.drawImage(canvas,-canvas.width/2,-canvas.height/2);
                return out;
              };
              const reader=new Reader();
              const attempts=[base,rotate(base,1),rotate(base,3)];
              for(const canvas of attempts){
                try{
                  const hit=reader.decodeFromCanvas(canvas);
                  const raw=typeof hit?.getText==="function"?hit.getText():(hit?.text||hit?.rawValue||"");
                  const code=normalizeBarcode(raw);
                  if(code)return code;
                }catch{}
              }
            }catch{}
            return "";
          }
          '''
          if 'async function zxingBarcodeFromFile' not in js:
              if marker not in js:
                  raise SystemExit('Could not find barcode result marker')
              js = js.replace(marker, zxing_fn + marker, 1)

          old_lookup = '''    let code=normalizeBarcode(barcode);
              if(file&&!code){if(result)result.textContent="Reading the barcode…";code=await nativeBarcodeFromFile(file);}
              if(btn)btn.disabled=true;
              try{
          '''
          new_lookup = '''    let code=normalizeBarcode(barcode);
              const readBtn=byId("sealedBarcodeReadBtn");
              if(file&&!code){if(result)result.textContent="Trying the phone's barcode reader…";code=await nativeBarcodeFromFile(file);}
              if(file&&!code){if(result)result.textContent="Trying Scout's barcode decoder…";code=await zxingBarcodeFromFile(file);}
              if(btn)btn.disabled=true;if(readBtn)readBtn.disabled=true;
              try{
          '''
          if old_lookup in js:
              js = js.replace(old_lookup, new_lookup, 1)
          elif "Trying Scout's barcode decoder" not in js:
              raise SystemExit('Could not find lookup block to patch')

          old_finally = '    finally{if(btn)btn.disabled=false;}\n'
          new_finally = '    finally{if(btn)btn.disabled=false;if(readBtn)readBtn.disabled=!activeBarcodeFile;}\n'
          if old_finally in js:
              js = js.replace(old_finally, new_finally, 1)

          scout.write_text(js, encoding='utf-8')
          PY

      - name: Validate barcode scanner patch
        shell: bash
        run: |
          node --check sealed-product-scout.js
          grep -q 'zxing-browser.min.js' index.html
          grep -q 'sealed-product-scout.js?v=6.1.2' index.html
          grep -q 'async function zxingBarcodeFromFile' sealed-product-scout.js
          grep -q "Trying Scout's barcode decoder" sealed-product-scout.js
          git diff --check

      - name: Commit barcode decoder upgrade
        shell: bash
        run: |
          if git diff --quiet; then
            echo 'No changes needed.'
            exit 0
          fi
          git config user.name 'HOF Card Scout Automation'
          git config user.email 'actions@users.noreply.github.com'
          git add index.html sealed-product-scout.js
          git commit -m 'Add iPhone barcode decoder fallback'
          git push
