name: Add Sealed Product Type Classifier

on:
  push:
    paths:
      - '.github/workflows/add-zxing-barcode.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply targeted product type classifier
        run: python3 scripts/apply-sealed-type-classifier.py

      - name: Validate sealed scanner changes
        run: |
          node --check sealed-product-scout.js
          node --check src/index.js
          node tests/sealed-product-vision.test.cjs
          grep -q 'sealed-product-scout.js?v=6.1.3' index.html
          grep -q '/sealed/classify-type' src/index.js
          grep -q 'TAKE FRONT PHOTO FOR PRODUCT TYPE' sealed-product-scout.js
          git diff --check

      - name: Commit targeted type classifier
        run: |
          if git diff --quiet; then
            echo 'No changes needed.'
            exit 0
          fi
          git config user.name 'HOF Card Scout Automation'
          git config user.email 'actions@users.noreply.github.com'
          git add index.html sealed-product-scout.js src/index.js tests/sealed-product-vision.test.cjs
          git commit -m 'Classify package type after barcode identification'
          git push
