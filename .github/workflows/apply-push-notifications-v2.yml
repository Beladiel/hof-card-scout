name: Apply push notifications v2

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/apply-push-notifications-v2.yml

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Correct helper placement
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('apply_push_notifications.py')
          s=p.read_text(encoding='utf-8')
          old='''# Wire UI after the app's main inline script so pricingConfig and navigation already exist.\np=Path('index.html')\nh=p.read_text(encoding='utf-8')\nassert '</body>' in h\nif 'push-notifications.js' not in h:\n    h=h.replace('</body>','<script src="push-notifications.js"></script>\\n</body>',1)\nh=h.replace('v5.9.0','v5.9.1')\np.write_text(h,encoding='utf-8')'''
          new='''# Wire UI beside the existing helper scripts, before the main inline app script.\np=Path('index.html')\nh=p.read_text(encoding='utf-8')\nhelper_marker='<script src="automation-runner-ui.js"></script>\\n<script>'\nassert helper_marker in h\nif 'push-notifications.js' not in h:\n    h=h.replace(helper_marker,'<script src="automation-runner-ui.js"></script>\\n<script src="push-notifications.js"></script>\\n<script>',1)\nh=h.replace('v5.9.0','v5.9.1')\np.write_text(h,encoding='utf-8')'''
          assert old in s
          p.write_text(s.replace(old,new,1),encoding='utf-8')
          PY
      - name: Apply push notification migration
        run: python apply_push_notifications.py
      - name: Check syntax
        run: |
          node --check src/index.js
          node --check push-notifications.js
          node --check scout-push-sw.js
      - name: Run regression suite
        run: |
          node collection-intelligence.test.cjs
          for f in tests/*.test.cjs; do
            echo "Running $f"
            node "$f"
          done
      - name: Commit changes
        run: |
          git config user.name "HOF Card Scout Automation"
          git config user.email "actions@users.noreply.github.com"
          git add src/index.js index.html push-notifications.js scout-push-sw.js tests/*.test.cjs
          if git diff --cached --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git commit -m "Add phone push notifications"
          git push
