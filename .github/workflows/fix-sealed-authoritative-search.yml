name: Fix Sealed Authoritative Search

on:
  push:
    paths:
      - '.github/workflows/fix-sealed-authoritative-search.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply authoritative search fix
        run: python3 scripts/fix-sealed-authoritative-search.py

      - name: Validate fix
        shell: bash
        run: |
          node --check src/index.js
          node --check sealed-product-scout.js
          node tests/sealed-product-vision.test.cjs
          grep -q 'const VERSION = "3.38.9"' src/index.js
          grep -q 'sealed:rip:v6:' src/index.js
          grep -q '(odds OR checklist OR "collector guide") -reddit -facebook -ebay -amazon' src/index.js
          grep -q 'const researchMix = {' src/index.js
          git diff --check

      - name: Commit fix
        shell: bash
        run: |
          if git diff --quiet; then
            echo 'No changes needed.'
            exit 0
          fi
          git config user.name 'HOF Card Scout Automation'
          git config user.email 'actions@users.noreply.github.com'
          git add src/index.js tests/sealed-product-vision.test.cjs
          git commit -m 'Fix sealed authoritative rip research query'
          git push
