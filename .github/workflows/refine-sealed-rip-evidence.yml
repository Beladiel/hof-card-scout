name: Refine Sealed Rip Evidence

on:
  push:
    paths:
      - '.github/workflows/refine-sealed-rip-evidence.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply rip evidence refinement
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('scripts/refine-sealed-rip-evidence.py')
          text=p.read_text(encoding='utf-8')
          old='out, count = re.subn(pattern, repl, text, count=1, flags=flags)'
          new='out, count = re.subn(pattern, lambda _m: repl, text, count=1, flags=flags)'
          if old not in text:
              raise SystemExit('Could not repair regex replacement escaping')
          p.write_text(text.replace(old,new,1),encoding='utf-8')
          PY
          python3 scripts/refine-sealed-rip-evidence.py

      - name: Validate refinement
        shell: bash
        run: |
          node --check src/index.js
          node --check sealed-product-scout.js
          node tests/sealed-product-vision.test.cjs
          grep -q 'const VERSION = "3.38.5"' src/index.js
          grep -q 'sealed:rip:v2:' src/index.js
          grep -q 'sealedRipExpandEvidenceRows' src/index.js
          grep -q 'chaseEvidenceAvailable' src/index.js
          grep -q 'NEED MORE DATA' src/index.js
          grep -q 'sealed-product-scout.js?v=6.1.8' index.html
          git diff --check

      - name: Commit refinement
        shell: bash
        run: |
          if git diff --quiet; then
            echo 'No changes needed.'
            exit 0
          fi
          git config user.name 'HOF Card Scout Automation'
          git config user.email 'actions@users.noreply.github.com'
          git add src/index.js sealed-product-scout.js index.html tests/sealed-product-vision.test.cjs
          git commit -m 'Improve sealed chase and odds evidence'
          git push
