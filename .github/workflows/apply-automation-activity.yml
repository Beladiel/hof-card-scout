name: Apply automation activity

on:
  push:
    branches: [main]
    paths:
      - apply_automation_activity.py
      - .github/workflows/apply-automation-activity.yml

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply activity migration
        run: python apply_automation_activity.py
      - name: Check syntax
        run: |
          node --check src/index.js
          node --check automation-runner-ui.js
      - name: Run regression suite
        run: |
          node collection-intelligence.test.cjs
          for f in tests/*.test.cjs; do
            echo "Running $f"
            node "$f"
          done
      - name: Commit changes
        run: |
          git config user.name "HOF Card Scout Automation"
          git config user.email "actions@users.noreply.github.com"
          git add src/index.js automation-runner-ui.js tests/*.test.cjs
          if git diff --cached --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git commit -m "Add automation activity history"
          git push
