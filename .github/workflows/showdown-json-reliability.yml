name: Showdown JSON Reliability

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/showdown-json-reliability.yml'

permissions:
  contents: write

jobs:
  patch-test-deploy:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply Showdown JSON reliability patch
        run: python3 scripts/showdown-json-reliability.py

      - name: Refresh version and cache regressions
        run: |
          python3 - <<'PY'
          from pathlib import Path

          p=Path('tests/sealed-product-vision.test.cjs')
          s=p.read_text(encoding='utf-8')
          replacements={
            'assert.match(worker,/const VERSION = "3\\.47\\.0"/);':'assert.match(worker,/const VERSION = "3\\.48\\.0"/);',
            "assert.match(worker,/sealed:intel:v18:/,'sealed product intelligence must use a reusable mode-scoped product cache');":"assert.match(worker,/sealed:intel:v19:/,'sealed product intelligence must use a reusable mode-scoped product cache');",
          }
          for old,new in replacements.items():
              if old not in s:
                  raise SystemExit(f'stale sealed-product regression not found: {old}')
              s=s.replace(old,new,1)
          p.write_text(s,encoding='utf-8')

          p=Path('tests/showdown-research-reliability.test.cjs')
          s=p.read_text(encoding='utf-8')
          replacements={
            "assert.ok(worker.includes('const VERSION = \"3.47.0\"'));":"assert.ok(worker.includes('const VERSION = \"3.48.0\"'));",
            "assert.ok(worker.includes('sealed:intel:v18:'));":"assert.ok(worker.includes('sealed:intel:v19:'));",
          }
          for old,new in replacements.items():
              if old not in s:
                  raise SystemExit(f'stale Showdown regression not found: {old}')
              s=s.replace(old,new,1)
          p.write_text(s,encoding='utf-8')
          PY

      - name: Validate Showdown JSON reliability
        run: |
          set -euo pipefail
          node --check src/index.js
          node --check sealed-product-scout.js
          node tests/sealed-product-vision.test.cjs
          node tests/chase-depth-canonical.test.cjs
          node tests/format-access-section-local.test.cjs
          node tests/showdown-research-reliability.test.cjs
          node tests/showdown-json-reliability.test.cjs
          grep -q 'const VERSION = "3.48.0"' src/index.js
          grep -q 'sealed:intel:v19:' src/index.js
          git diff --check

      - name: Commit Showdown JSON reliability
        run: |
          set -euo pipefail
          git config user.name 'HOF Card Scout Automation'
          git config user.email 'actions@users.noreply.github.com'
          git add src/index.js tests/sealed-product-vision.test.cjs tests/showdown-research-reliability.test.cjs tests/showdown-json-reliability.test.cjs
          git commit -m 'Make Showdown AI synthesis resilient'
          git push

      - name: Deploy Worker
        env:
          CF_API_TOKEN_RAW: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CF_ACCOUNT_ID_RAW: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          if [[ "$CF_API_TOKEN_RAW" =~ (cfut_[A-Za-z0-9_-]+) ]]; then
            export CLOUDFLARE_API_TOKEN="${BASH_REMATCH[1]}"
          else
            TOKEN_CLEAN="$(printf '%s' "$CF_API_TOKEN_RAW" | tr -d '\r\n\t ')"
            TOKEN_CLEAN="${TOKEN_CLEAN#Bearer}"
            TOKEN_CLEAN="${TOKEN_CLEAN#bearer}"
            TOKEN_CLEAN="${TOKEN_CLEAN//\"/}"
            TOKEN_CLEAN="${TOKEN_CLEAN//\'/}"
            export CLOUDFLARE_API_TOKEN="$TOKEN_CLEAN"
          fi
          export CLOUDFLARE_ACCOUNT_ID="$(printf '%s' "$CF_ACCOUNT_ID_RAW" | tr -d '\r\n\t ')"
          test -n "$CLOUDFLARE_API_TOKEN"
          test -n "$CLOUDFLARE_ACCOUNT_ID"
          npx --yes wrangler@4 deploy
