name: Apply Sealed Vision Accuracy

on:
  push:
    branches: [main]
    paths:
      - apply-sealed-vision-accuracy.py
      - .github/workflows/apply-sealed-vision-accuracy.yml

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply sealed vision accuracy migration
        run: python apply-sealed-vision-accuracy.py
      - name: Check JavaScript syntax
        run: node --check src/index.js
      - name: Run regression suite
        run: |
          node collection-intelligence.test.cjs
          for f in tests/*.test.cjs; do
            echo "Running $f"
            node "$f"
          done
      - name: Commit changes
        run: |
          git config user.name "HOF Card Scout Automation"
          git config user.email "actions@users.noreply.github.com"
          git add src/index.js tests/*.test.cjs
          if git diff --cached --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git commit -m "Improve sealed product photo accuracy"
          git push
