name: Apply Sealed Barcode UI Fix

on:
  push:
    branches: [main]
    paths:
      - apply-sealed-barcode-ui.py
      - .github/workflows/apply-sealed-barcode-ui.yml

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply barcode UI migration
        run: python apply-sealed-barcode-ui.py
      - name: Check JavaScript syntax
        run: node --check sealed-product-scout.js
      - name: Run sealed-product regression
        run: node tests/sealed-product-vision.test.cjs
      - name: Commit barcode UI fix and remove migration files
        run: |
          git config user.name "HOF Card Scout Automation"
          git config user.email "actions@users.noreply.github.com"
          git rm apply-sealed-barcode-ui.py .github/workflows/apply-sealed-barcode-ui.yml
          git add sealed-product-scout.js tests/sealed-product-vision.test.cjs
          git commit -m "Make barcode photo scan explicit and visible"
          git push origin main
