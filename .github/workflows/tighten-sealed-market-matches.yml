name: Tighten Sealed Market Matches

on:
  push:
    paths:
      - '.github/workflows/tighten-sealed-market-matches.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply sealed market match tightening
        run: python3 scripts/tighten-sealed-market-matches.py

      - name: Validate changes
        shell: bash
        run: |
          node --check src/index.js
          node tests/sealed-product-vision.test.cjs
          grep -q 'const VERSION = "3.38.2"' src/index.js
          grep -q 'sealed:value:v2:' src/index.js
          grep -q 'sealedMarketIdentityMatches' src/index.js
          grep -q 'sealedMarketIsMultiUnit' src/index.js
          git diff --check

      - name: Commit changes
        shell: bash
        run: |
          if git diff --quiet; then
            echo 'No changes needed.'
            exit 0
          fi
          git config user.name 'HOF Card Scout Automation'
          git config user.email 'actions@users.noreply.github.com'
          git add src/index.js tests/sealed-product-vision.test.cjs
          git commit -m 'Tighten sealed product market matches'
          git push
