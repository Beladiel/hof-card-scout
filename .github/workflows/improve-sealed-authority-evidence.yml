name: Improve Sealed Authority Evidence

on:
  push:
    paths:
      - '.github/workflows/improve-sealed-authority-evidence.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply authority evidence refinement
        run: python3 scripts/improve-sealed-authority-evidence.py

      - name: Validate fix
        shell: bash
        run: |
          node --check src/index.js
          node --check sealed-product-scout.js
          node tests/sealed-product-vision.test.cjs
          grep -q 'const VERSION = "3.38.13"' src/index.js
          grep -q 'sealed:rip:v10:' src/index.js
          grep -q 'sealedRipSerpEvidenceText' src/index.js
          grep -q 'ampLink' src/index.js
          grep -q 'cachedPageLink' src/index.js
          grep -q '18000, "mobile"' src/index.js
          git diff --check

      - name: Commit fix
        shell: bash
        run: |
          if git diff --quiet; then
            echo 'No changes needed.'
            exit 0
          fi
          git config user.name 'HOF Card Scout Automation'
          git config user.email 'actions@users.noreply.github.com'
          git add src/index.js tests/sealed-product-vision.test.cjs
          git commit -m 'Use structured authority evidence for rip research'
          git push
