name: Shift Sealed Buy Recommendation

on:
  push:
    paths:
      - '.github/workflows/shift-sealed-buy-recommendation.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply sealed buy recommendation architecture
        shell: bash
        run: |
          python3 scripts/shift-sealed-buy-recommendation.py
          python3 - <<'PY'
          from pathlib import Path
          p=Path('tests/sealed-product-vision.test.cjs')
          text=p.read_text(encoding='utf-8')
          text=text.replace("assert.match(app,/CHECK RIP QUALITY · 2 RESEARCH SEARCHES MAX/,'sealed scanner must expose rip-quality research');", "assert.match(app,/GET SCOUT'S BUY CALL · 2 RESEARCH SEARCHES MAX/,'sealed scanner must expose the final buy recommendation');")
          p.write_text(text,encoding='utf-8')
          PY

      - name: Validate changes
        shell: bash
        run: |
          node --check src/index.js
          node --check sealed-product-scout.js
          node tests/sealed-product-vision.test.cjs
          grep -q 'const VERSION = "3.39.0"' src/index.js
          grep -q 'sealed:intel:v1:' src/index.js
          grep -q 'sealedRipProductEvidenceCount' src/index.js
          grep -q 'sealedRipChaseContextSupported' src/index.js
          grep -q '14 \* 24 \* 60 \* 60' src/index.js
          grep -q 'STEP 4 · SHOULD I BUY THIS?' sealed-product-scout.js
          grep -q 'sealed-product-scout.js?v=6.2.0' index.html
          git diff --check

      - name: Commit feature
        shell: bash
        run: |
          if git diff --quiet; then
            echo 'No changes needed.'
            exit 0
          fi
          git config user.name 'HOF Card Scout Automation'
          git config user.email 'actions@users.noreply.github.com'
          git add src/index.js sealed-product-scout.js index.html tests/sealed-product-vision.test.cjs
          git commit -m 'Shift sealed Scout to practical buy recommendations'
          git push
