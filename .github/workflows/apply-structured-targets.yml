name: Apply structured target management

on:
  push:
    branches: [main]
    paths:
      - apply_structured_targets.py
      - .github/workflows/apply-structured-targets.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply migration
        run: python apply_structured_targets.py
      - name: Run Collection Intelligence tests
        run: node collection-intelligence.test.cjs
      - name: Run target ranking tests
        run: node tests/target-ranking.test.cjs
      - name: Run Top 5 contract test
        run: node tests/top5-targets.test.cjs
      - name: Run structured target tests
        run: node tests/structured-targets.test.cjs
      - name: Commit changes
        run: |
          if git diff --quiet; then
            echo "No changes to commit."
            exit 0
          fi
          git config user.name "HOF Card Scout Automation"
          git config user.email "actions@users.noreply.github.com"
          git add index.html phase6-find-target.html tests/structured-targets.test.cjs
          git commit -m "Add structured target management"
          git push origin main
