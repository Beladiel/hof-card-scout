name: Improve Sealed Rip Source Ranking

on:
  push:
    paths:
      - '.github/workflows/improve-sealed-rip-source-ranking.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply source-ranking refinement
        run: python3 scripts/improve-sealed-rip-source-ranking.py

      - name: Validate refinement
        shell: bash
        run: |
          node --check src/index.js
          node --check sealed-product-scout.js
          node tests/sealed-product-vision.test.cjs
          grep -q 'const VERSION = "3.38.7"' src/index.js
          grep -q 'sealed:rip:v4:' src/index.js
          grep -q 'sealedRipEvidencePriority' src/index.js
          grep -q 'url.searchParams.set("num", "20")' src/index.js
          grep -q 'const chaseEvidenceAvailable = chaseCards.length > 0' src/index.js
          git diff --check

      - name: Commit refinement
        shell: bash
        run: |
          if git diff --quiet; then
            echo 'No changes needed.'
            exit 0
          fi
          git config user.name 'HOF Card Scout Automation'
          git config user.email 'actions@users.noreply.github.com'
          git add src/index.js tests/sealed-product-vision.test.cjs
          git commit -m 'Improve sealed chase and odds source ranking'
          git push
