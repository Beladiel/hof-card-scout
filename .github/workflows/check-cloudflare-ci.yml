name: Check Cloudflare CI readiness

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/check-cloudflare-ci.yml

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Check configured secret names
        env:
          CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CF_ACCOUNT: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ -n "$CF_TOKEN" ]; then echo "CLOUDFLARE_API_TOKEN=CONFIGURED"; else echo "CLOUDFLARE_API_TOKEN=MISSING"; fi
          if [ -n "$CF_ACCOUNT" ]; then echo "CLOUDFLARE_ACCOUNT_ID=CONFIGURED"; else echo "CLOUDFLARE_ACCOUNT_ID=MISSING"; fi
