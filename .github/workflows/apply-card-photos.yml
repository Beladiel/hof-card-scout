name: Apply representative card photos

on:
  push:
    branches: [main]
    paths:
      - apply_card_photos.py
      - card-photo.js
      - .github/workflows/apply-card-photos.yml

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply card photo feature
        run: python apply_card_photos.py
      - name: Update version assertions
        run: |
          python - <<'PY'
          from pathlib import Path
          for p in Path("tests").glob("*.test.cjs"):
              s=p.read_text(encoding="utf-8")
              s=s.replace("3.25.1","3.26.0")
              s=s.replace(r"v5\.7\.0",r"v5\.8\.0")
              s=s.replace("5.7.0","5.8.0")
              p.write_text(s,encoding="utf-8")
          PY
      - name: Syntax-check Worker and browser helpers
        run: |
          node --check src/index.js
          node --check card-photo.js
      - name: Run full regression suite
        run: |
          node collection-intelligence.test.cjs
          for f in tests/*.test.cjs; do
            echo "Running $f"
            node "$f"
          done
      - name: Commit changes
        run: |
          git config user.name "HOF Card Scout Automation"
          git config user.email "actions@users.noreply.github.com"
          git add index.html src/index.js tests
          if git diff --cached --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git commit -m "Add representative card photos"
          git push
