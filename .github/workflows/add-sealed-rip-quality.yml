name: Add Sealed Rip Quality

on:
  push:
    paths:
      - '.github/workflows/add-sealed-rip-quality.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Repair migration targets and apply feature
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('scripts/add-sealed-rip-quality.py')
          text=p.read_text(encoding='utf-8')

          old="app = replace_once(app, 'renderConfirmed(draft);renderMarketResearch(draft.marketResearch);', 'renderConfirmed(draft);renderMarketResearch(draft.marketResearch);renderRipQuality(draft.ripQuality);', 'restore rip result')"
          new="app = replace_once(app, '    renderConfirmed(draft);\\n    renderMarketResearch(draft.marketResearch);', '    renderConfirmed(draft);\\n    renderMarketResearch(draft.marketResearch);\\n    renderRipQuality(draft.ripQuality);', 'restore rip result')"
          if old not in text:
              raise SystemExit('Could not repair restore-rip migration target')
          text=text.replace(old,new,1)

          lines=text.splitlines()
          found=False
          for i,line in enumerate(lines):
              if 'rip-quality route must use Google research searches' in line:
                  lines[i] = "assert.ok(worker.includes('url.searchParams.set(\\\"engine\\\", \\\"google\\\")'),'rip-quality research must use Google searches');"
                  found=True
                  break
          if not found:
              raise SystemExit('Could not repair Google-search regression assertion')
          p.write_text('\n'.join(lines)+'\n',encoding='utf-8')
          PY
          python3 scripts/add-sealed-rip-quality.py

      - name: Validate changes
        shell: bash
        run: |
          node --check src/index.js
          node --check sealed-product-scout.js
          node tests/sealed-product-vision.test.cjs
          grep -q 'const VERSION = "3.38.4"' src/index.js
          grep -q 'sealed:rip:v1:' src/index.js
          grep -q '/sealed/rip-quality' src/index.js
          grep -q 'sealed-product-scout.js?v=6.1.7' index.html
          grep -q 'CHECK RIP QUALITY · 2 RESEARCH SEARCHES MAX' sealed-product-scout.js
          git diff --check

      - name: Commit feature
        shell: bash
        run: |
          if git diff --quiet; then
            echo 'No changes needed.'
            exit 0
          fi
          git config user.name 'HOF Card Scout Automation'
          git config user.email 'actions@users.noreply.github.com'
          git add src/index.js sealed-product-scout.js index.html tests/sealed-product-vision.test.cjs
          git commit -m 'Add sealed rip quality research'
          git push
