name: Apply Top 5 full shortlist

on:
  push:
    branches: [main]
    paths:
      - apply_top5_full_shortlist.py
      - .github/workflows/apply-top5-full-shortlist.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply migration
        run: python apply_top5_full_shortlist.py
      - name: Validate Worker syntax
        run: node --check src/index.js
      - name: Run Collection Intelligence tests
        run: node collection-intelligence.test.cjs
      - name: Run target ranking tests
        run: node tests/target-ranking.test.cjs
      - name: Run Top 5 contract test
        run: node tests/top5-targets.test.cjs
      - name: Commit changes
        run: |
          if git diff --quiet; then
            echo "No changes to commit."
            exit 0
          fi
          git config user.name "HOF Card Scout Automation"
          git config user.email "actions@users.noreply.github.com"
          git add src/index.js index.html phase6-find-target.html tests/target-ranking.test.cjs
          git commit -m "Rank full Top 5 target shortlist"
          git push origin main
