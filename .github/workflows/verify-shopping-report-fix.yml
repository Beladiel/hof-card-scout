name: Verify shopping report fix

on:
  push:
    branches: [main]
    paths:
      - shopping-report.js
      - tests/offline-shopping-report.test.cjs
      - .github/workflows/verify-shopping-report-fix.yml

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run full regression suite
        run: |
          for f in tests/*.test.cjs; do
            echo "Running $f"
            node "$f"
          done
