name: Fix Showdown Incomplete Ranking

on:
  push:
    paths:
      - 'scripts/fix-showdown-incomplete-ranking.py'
      - '.github/workflows/fix-showdown-incomplete-ranking.yml'

permissions:
  contents: write

jobs:
  patch-test-commit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply incomplete-ranking safety migration
        run: python3 scripts/fix-showdown-incomplete-ranking.py

      - name: Validate Showdown safety fix
        run: |
          set -euo pipefail
          node --check src/index.js
          node --check sealed-product-scout.js
          node tests/sealed-product-vision.test.cjs
          grep -q 'INCOMPLETE · NOT RANKED' sealed-product-scout.js
          grep -q 'const rankable=missing.length===0' sealed-product-scout.js
          grep -q 'rankableCount>=2' sealed-product-scout.js
          grep -q 'sealed-product-scout.js?v=6.5.1' index.html
          git diff --check

      - name: Commit safety fix
        run: |
          set -euo pipefail
          git config user.name 'HOF Card Scout Automation'
          git config user.email 'actions@users.noreply.github.com'
          git add sealed-product-scout.js index.html tests/sealed-product-vision.test.cjs
          git commit -m 'Make incomplete Showdown products unrankable'
          git push
