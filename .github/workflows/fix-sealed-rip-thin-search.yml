name: Fix Sealed Rip Thin Search

on:
  push:
    paths:
      - '.github/workflows/fix-sealed-rip-thin-search.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply thin-search fix
        run: python3 scripts/fix-sealed-rip-thin-search.py

      - name: Validate fix
        shell: bash
        run: |
          node --check src/index.js
          node --check sealed-product-scout.js
          node tests/sealed-product-vision.test.cjs
          grep -q 'const VERSION = "3.38.6"' src/index.js
          grep -q 'sealed:rip:v3:' src/index.js
          grep -q 'sealedRipResearchSet' src/index.js
          grep -q 'if (!evidenceRows.length)' src/index.js
          git diff --check

      - name: Commit fix
        shell: bash
        run: |
          if git diff --quiet; then
            echo 'No changes needed.'
            exit 0
          fi
          git config user.name 'HOF Card Scout Automation'
          git config user.email 'actions@users.noreply.github.com'
          git add src/index.js tests/sealed-product-vision.test.cjs
          git commit -m 'Fix sealed rip research over-filtering'
          git push
