name: Apply Sealed Product Wording

on:
  push:
    branches: [main]
    paths:
      - apply-sealed-wording.py
      - .github/workflows/apply-sealed-wording.yml

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply wording update
        run: python apply-sealed-wording.py
      - name: Check syntax
        run: node --check sealed-product-scout.js
      - name: Run regression suite
        run: |
          node collection-intelligence.test.cjs
          for f in tests/*.test.cjs; do
            echo "Running $f"
            node "$f"
          done
      - name: Commit changes
        run: |
          git config user.name "HOF Card Scout Automation"
          git config user.email "actions@users.noreply.github.com"
          git add sealed-product-scout.js index.html tests/*.test.cjs
          if git diff --cached --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git commit -m "Broaden Sealed Product Scout wording"
          git push
