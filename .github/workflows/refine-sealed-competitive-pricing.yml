name: Refine Sealed Competitive Pricing

on:
  push:
    paths:
      - '.github/workflows/refine-sealed-competitive-pricing.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply competitive pricing refinement
        run: python3 scripts/refine-sealed-competitive-pricing.py

      - name: Validate changes
        shell: bash
        run: |
          node --check src/index.js
          node --check sealed-product-scout.js
          node tests/sealed-product-vision.test.cjs
          grep -q 'const VERSION = "3.38.3"' src/index.js
          grep -q 'sealed:value:v3:' src/index.js
          grep -q 'sealedMarketCompetitiveSummary' src/index.js
          grep -q 'sealed-product-scout.js?v=6.1.6' index.html
          git diff --check

      - name: Commit changes
        shell: bash
        run: |
          if git diff --quiet; then
            echo 'No changes needed.'
            exit 0
          fi
          git config user.name 'HOF Card Scout Automation'
          git config user.email 'actions@users.noreply.github.com'
          git add src/index.js sealed-product-scout.js index.html tests/sealed-product-vision.test.cjs
          git commit -m 'Use competitive sealed listing median'
          git push
