name: Apply Future HOF target parity

on:
  push:
    branches: [main]
    paths:
      - apply_future_target_parity.py
      - .github/workflows/apply-future-target-parity.yml

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply migration
        run: python apply_future_target_parity.py
      - name: Run Future HOF target parity tests
        run: node tests/future-target-parity.test.cjs
      - name: Run Collection Intelligence tests
        run: node collection-intelligence.test.cjs
      - name: Run target ranking tests
        run: node tests/target-ranking.test.cjs
      - name: Run Top 5 tests
        run: node tests/top5-targets.test.cjs
      - name: Commit changes
        run: |
          git config user.name "HOF Card Scout Automation"
          git config user.email "actions@users.noreply.github.com"
          git add index.html tests/future-target-parity.test.cjs
          if git diff --cached --quiet; then
            echo "No migration changes needed."
            exit 0
          fi
          git commit -m "Give Future HOF targets full target controls"
          git push origin main
