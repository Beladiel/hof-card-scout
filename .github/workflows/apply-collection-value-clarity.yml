name: Apply collection value clarity

on:
  push:
    branches: [main]
    paths:
      - apply_collection_value_clarity.py
      - tests/collection-value-clarity.test.cjs
      - .github/workflows/apply-collection-value-clarity.yml

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply clarity fix
        run: python apply_collection_value_clarity.py
      - name: Run regression suite
        run: |
          node collection-intelligence.test.cjs
          for f in tests/*.test.cjs; do
            echo "Running $f"
            node "$f"
          done
      - name: Commit changes
        run: |
          git config user.name "HOF Card Scout Automation"
          git config user.email "actions@users.noreply.github.com"
          git add index.html tests/collection-value-clarity.test.cjs
          if git diff --cached --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git commit -m "Clarify unsaved collection values"
          git push
