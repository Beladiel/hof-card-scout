name: Ship Sealed Chase Depth V1

on:
  push:
    paths:
      - '.github/workflows/add-sealed-chase-depth-v1-ship.yml'

permissions:
  contents: write

jobs:
  patch-test-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Normalize Showdown render insertion point
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('sealed-product-scout.js')
          text=p.read_text(encoding='utf-8')
          old='''<div class="sealed-showdown-copy"><strong>Why it ranks here:</strong> ${esc(showdownReason(row))}<br>${esc(formatCopy)}</div>${issue}</div>`;'''
          new='''<div class="sealed-showdown-copy"><strong>Why it ranks here:</strong> ${esc(showdownReason(row))}</div><div class="sealed-showdown-copy">${esc(formatCopy)}</div>${issue}</div>`;'''
          if old not in text:
              raise SystemExit('missing Showdown render block')
          p.write_text(text.replace(old,new,1),encoding='utf-8')
          PY

      - name: Apply Chase Depth migration
        run: python3 scripts/add-sealed-chase-depth-v1.py

      - name: Update regression tests
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('tests/sealed-product-vision.test.cjs')
          text=p.read_text(encoding='utf-8')
          old="assert.match(worker,/14 \\* 24 \\* 60 \\* 60/,'product intelligence should be reusable for fourteen days');"
          new=("assert.ok(worker.includes('researchMode === \\\"showdown\\\" ? 3 : 14'),'Showdown price-guide intelligence should refresh after three days while single-product intelligence remains reusable for fourteen');\\n"
               "assert.match(worker,/intelligenceTtlDays \\* 24 \\* 60 \\* 60/,'mode-specific intelligence TTL must be applied to cache writes');")
          new=new.replace('\\n','\n')
          if old not in text:
              raise SystemExit('missing old fixed-TTL assertion')
          text=text.replace(old,new,1)
          text=text.replace("assert.ok(front.includes('researchMode:\"showdown\"'),'front end must request Showdown research mode');","assert.ok(app.includes('researchMode:\"showdown\"'),'front end must request Showdown research mode');")
          text=text.replace("assert.ok(front.includes('CHASE DEPTH'),'Showdown must display Chase Depth');","assert.ok(app.includes('CHASE DEPTH'),'Showdown must display Chase Depth');")
          text=text.replace("assert.ok(front.includes('depth*.35+format*.25+price*.20+set*.15+support*.05'),'Showdown weights must prioritize Chase Depth without over-weighting support');","assert.ok(app.includes('depth*.35+format*.25+price*.20+set*.15+support*.05'),'Showdown weights must prioritize Chase Depth without over-weighting support');")
          p.write_text(text,encoding='utf-8')
          PY

      - name: Validate Chase Depth
        shell: bash
        run: |
          set -euo pipefail
          node --check src/index.js
          node --check sealed-product-scout.js
          node tests/sealed-product-vision.test.cjs
          grep -q 'const VERSION = "3.42.0"' src/index.js
          grep -q 'sealed:intel:v11:' src/index.js
          grep -q 'sealedRipPriceGuideQuery' src/index.js
          grep -q 'sealedRipChaseDepthMetrics' src/index.js
          grep -q 'researchMode:"showdown"' sealed-product-scout.js
          grep -q 'CHASE DEPTH' sealed-product-scout.js
          grep -q 'sealed-product-scout.js?v=6.5.0' index.html
          git diff --check

      - name: Commit feature
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'HOF Card Scout Automation'
          git config user.email 'actions@users.noreply.github.com'
          git add src/index.js sealed-product-scout.js index.html tests/sealed-product-vision.test.cjs
          git commit -m 'Add set-level Chase Depth to Shelf Showdown'
          git push

      - name: Deploy Worker
        env:
          CF_API_TOKEN_RAW: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CF_ACCOUNT_ID_RAW: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ "$CF_API_TOKEN_RAW" =~ (cfut_[A-Za-z0-9_-]+) ]]; then
            export CLOUDFLARE_API_TOKEN="${BASH_REMATCH[1]}"
          else
            TOKEN_CLEAN="$(printf '%s' "$CF_API_TOKEN_RAW" | tr -d '\r\n\t ')"
            TOKEN_CLEAN="${TOKEN_CLEAN#Bearer}"
            TOKEN_CLEAN="${TOKEN_CLEAN#bearer}"
            TOKEN_CLEAN="${TOKEN_CLEAN//\"/}"
            TOKEN_CLEAN="${TOKEN_CLEAN//\'/}"
            export CLOUDFLARE_API_TOKEN="$TOKEN_CLEAN"
          fi
          export CLOUDFLARE_ACCOUNT_ID="$(printf '%s' "$CF_ACCOUNT_ID_RAW" | tr -d '\r\n\t ')"
          npx --yes wrangler@4 deploy
