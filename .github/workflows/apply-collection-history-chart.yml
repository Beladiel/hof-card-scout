name: Apply collection history chart

on:
  push:
    branches: [main]
    paths:
      - apply_collection_history_chart.py
      - collection-value-dashboard.js
      - tests/collection-value-history-dashboard.test.cjs
      - .github/workflows/apply-collection-history-chart.yml

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply collection history UI
        run: python apply_collection_history_chart.py
      - name: Run regression suite
        run: |
          node collection-intelligence.test.cjs
          for f in tests/*.test.cjs; do
            echo "Running $f"
            node "$f"
          done
      - name: Commit changes
        run: |
          git config user.name "HOF Card Scout Automation"
          git config user.email "actions@users.noreply.github.com"
          git add index.html collection-value-dashboard.js tests/collection-value-history-dashboard.test.cjs
          if git diff --cached --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git commit -m "Add whole collection value history chart"
          git push
