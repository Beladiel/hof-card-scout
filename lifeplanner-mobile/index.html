<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#173c61">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="LifePlanner">
<meta name="description" content="LifePlanner Mobile — countdowns, appointments, school deadlines and milestones.">
<title>LifePlanner Mobile · Scout</title>
<link rel="icon" type="image/svg+xml" href="./icon.svg">
<link rel="manifest" href="./manifest.webmanifest">
<link rel="stylesheet" href="./styles.css?v=2">
<script src="./app.js?v=2" defer></script>
<script src="./cloud-sync.js?v=3" defer></script>
</head>
<body>
<div class="shell">
 <header class="masthead">
  <div class="logo">✦</div>
  <div class="brand"><span class="kicker">SCOUT'S EVERYDAY ORGANIZER</span><h1>Life<span>Planner</span></h1><span class="edition">Mobile v2.0</span></div>
  <button class="btn add-main" type="button" data-action="add">+ Add</button>
 </header>
 <nav class="tabs" aria-label="LifePlanner sections">
  <button data-tab="dashboard" class="active">⌂ Dashboard</button>
  <button data-tab="events">▤ Events</button>
  <button data-tab="completed">✓ History</button>
  <button data-tab="sync">⇅ Backup & Sync</button>
 </nav>
 <main id="content" aria-live="polite"><div class="empty">Loading your planner…</div></main>
 <footer class="footer">Private cloud sync optional · Your original Windows LifePlanner stays on your PC</footer>
</div>
<div id="dialog"></div>
<input type="file" id="importPicker" accept=".json,application/json" hidden>
<input type="file" id="cloudPairFile" accept=".json,application/json" hidden>
<div id="toast" role="status" class="toast"></div>
</body>
</html>
